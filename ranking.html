<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking poziomów — Entuzjaści Hopkostki</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235865f2'/><text x='50' y='66' font-size='46' font-weight='700' font-family='sans-serif' text-anchor='middle' fill='white'>EH</text></svg>">
  <style>
    :root { --bg: #1e1f22; --bg-2: #2b2d31; --line: #3f4147; --text: #dbdee1; --muted: #949ba4; --accent: #5865f2; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    header img { width: 56px; height: 56px; border-radius: 16px; }
    h1 { margin: 0; font-size: 1.4rem; color: #fff; }
    .muted { color: var(--muted); }
    .row { display: grid; grid-template-columns: 44px 40px 1fr auto; gap: 12px; align-items: center; background: var(--bg-2); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
    .rank { font-weight: 700; color: var(--muted); text-align: center; }
    .row:nth-child(1) .rank { color: #f1c40f; } .row:nth-child(2) .rank { color: #c0c7cf; } .row:nth-child(3) .rank { color: #d9884a; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--line); }
    .name { font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 6px; border-radius: 3px; background: var(--bg); margin-top: 6px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--accent); }
    .stats { text-align: right; white-space: nowrap; }
    .stats strong { color: #fff; font-size: 1.05rem; }
    .stats small { display: block; color: var(--muted); }
    .more { display: block; margin: 16px auto 0; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    @media (max-width: 480px) { .row { grid-template-columns: 30px 34px 1fr; } .stats { grid-column: 2 / -1; text-align: left; } .avatar { width: 34px; height: 34px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <img id="icon" alt="" hidden>
      <div>
        <h1 id="title">Ranking poziomów</h1>
        <div class="muted">XP za wiadomości, kanały głosowe i reakcje · <code>/rank</code> pokazuje Twoją kartę</div>
      </div>
    </header>
    <div id="list"><p class="muted">Ładowanie…</p></div>
    <button type="button" class="more" id="more" hidden>Pokaż więcej</button>
  </main>
  <script>
    'use strict';
    const API = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'public/leaderboard' : 'https://ucjmbdogtzztrkorqzjq.supabase.co/functions/v1/hopkostki-bot/panel/public/leaderboard';
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const fmt = (n) => Number(n).toLocaleString('pl-PL');
    let offset = 0;
    async function load() {
      const list = document.getElementById('list');
      try {
        const res = await fetch(`${API}?offset=${offset}`);
        const data = await res.json();
        if (!data.enabled) {
          list.innerHTML = '<p class="muted">Ranking jest teraz niedostępny.</p>';
          return;
        }
        if (data.guild) {
          document.getElementById('title').textContent = `Ranking poziomów — ${data.guild.name}`;
          if (data.guild.icon) Object.assign(document.getElementById('icon'), { src: data.guild.icon, hidden: false });
        }
        if (data.color) document.documentElement.style.setProperty('--accent', data.color);
        const rows = data.entries
          .map((e) => {
            const pct = e.needed ? Math.floor((e.current / e.needed) * 100) : 100;
            return `<div class="row">
              <div class="rank">${e.rank}</div>
              <img class="avatar" src="${esc(e.avatar)}" alt="" loading="lazy">
              <div><div class="name">${esc(e.name)}</div><div class="bar" title="${fmt(e.current)} / ${fmt(e.needed)} XP do kolejnego poziomu"><span style="width:${pct}%"></span></div></div>
              <div class="stats"><strong>Poziom ${e.level}</strong><small>${fmt(e.xp)} XP · ${fmt(e.messages)} wiad.</small></div>
            </div>`;
          })
          .join('');
        if (offset === 0) list.innerHTML = rows || '<p class="muted">Nikt jeszcze nie zdobył XP.</p>';
        else list.insertAdjacentHTML('beforeend', rows);
        document.getElementById('more').hidden = data.entries.length < 100;
      } catch {
        list.innerHTML = '<p class="muted">Nie udało się wczytać rankingu — spróbuj za chwilę.</p>';
      }
    }
    document.getElementById('more').addEventListener('click', () => {
      offset += 100;
      load();
    });
    load();
  </script>
</body>
</html>
